# Yatagarasu - Signal Curation System
# Updated May 12, 2026 for Majikari + Antler focus

schedule:
  morning: "07:00"      # Full sweep: all sources, all domains
  midday: "13:00"       # Light sweep: reduced scope
  evening: "19:00"      # Light sweep: catch anything missed

output:
  digest_dir: "~/Documents/Obsidian Vault/00 - Command Center/Yatagarasu"
  format: "markdown"

# ---- WHO ARE YOU? ----
profile:
  description: "a 23-year-old founder-engineer building cross-border data intelligence systems. Thinks like a quant (signal extraction, source weighting, noise filtering), builds like a Palantir FDSE (heterogeneous data fusion, entity-centric ontology), and operates like a cultural intelligence analyst (cascade detection, coded language, temporal lag as product)."
  projects:
    - "Majikari: cross-border search engine aggregating 186K Japanese secondhand fashion listings (Mercari JP, Yahoo Auctions) with CLIP classification, price intelligence, and proxy cost transparency"
    - "Antler NYC11 residency: Pre-IC pitch May 27-28, seeking $350K SAFE, need validation + co-founder"
    - "Contraband Wu: Chinese consumer culture intelligence -- cross-platform cascade tracking (XHS, Bilibili, Weibo), coded language detection, aesthetic migration prediction. Data moat accumulating."
    - "Crucible: NeurIPS 2026 paper on emergent deception in LLM game theory (submitted, maintenance mode)"
  noise_patterns:
    - "Benchmark leaderboard drama (unless top-3 shift)"
    - "AI doomer/accelerationist culture war"
    - "Celebrity tech takes"
    - "Generic 'AI will change everything' articles"
    - "Crypto/NFT/Web3 unless related to cross-border payments"
    - "Listicles and shallow trend roundups without data"

scoring:
  model: "claude-haiku-4-5-20251001"
  min_score: 3
  batch_size: 40
  tier_budgets:
    RED: 3
    ORANGE: 8
    YELLOW: 15

tiers:
  RED: "Act on this within 48h"
  ORANGE: "Shapes your mental model"
  YELLOW: "Context, no action needed"

