# ---- NOISE FILTERS ----
noise_filters:
  skip_domains:
    - "buzzfeed.com"
    - "dailymail.co.uk"
    - "techbro-hype.com"
  skip_patterns:
    - "benchmark leaderboard drama"
    - "AI will destroy"
    - "AI will save"
    - "crypto.*NFT"
    - "celebrity.*AI"
    - "Web3.*metaverse"
  dedup_window_hours: 48

# ---- NOTIFICATIONS ----
notifications:
  enabled: true
  max_per_sweep: 8
  backends:
    - type: "ntfy"
      topic: "yatagarasu-alexwu"
      min_tier: "RED"
    - type: "macos"
      min_tier: "ORANGE"

# ---- ORIENT PROMPT ----
orient_prompt: |
  ## Orient (fill in 2 min after reading)
  - What changed in my model of the world?
  - Does anything require action in the next 48h?
  - What did I read that was entertainment, not intelligence?
  - Any signal relevant to Pre-IC pitch (May 27)?
  - Any cascade signal? (same entity across Chinese + Western sources = breakout)
  - What would a quant do with this data? What would Palantir build?
